[project]
name = "roxstar-ai-voice-room"
version = "0.1.0"
description = "Roxstar AI Voice Room Assistant - Checkpoint 2 Local Hindi/Hinglish TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.8.0",
    "livekit-plugins-groq>=1.8.0",
    "livekit-plugins-openai>=1.8.0",
    "piper-tts>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
